<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StickTrack — Drum Lesson Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥁</text></svg>">
<style>
  :root {
    --radius: 3px;
    --mono:    'Space Mono', monospace;
    --display: 'Barlow Condensed', sans-serif;
    --red:    #d64e3a;
    --green:  #3aad7a;
    --lv-beginner:    #3aad7a;
    --lv-intermediate:#4a90d9;
    --lv-advanced:    #9b7dca;
    --lv-pro:         #d95f5f;
  }
  [data-theme="dark"] {
    --bg:#13151a; --bg2:#1b1e26; --bg3:#242830;
    --border:#2a2e3a; --border2:#363c4c;
    --text:#dde2ee; --text2:#8892a8; --text3:#4e5669;
    --accent:#5b8dee; --accent2:#3a6bd4;
    --accent-glow:rgba(91,141,238,0.13); --scrollthumb:#363c4c;
  }
  [data-theme="light"] {
    --bg:#f0f2f7; --bg2:#ffffff; --bg3:#e8ebf2;
    --border:#d4d9e8; --border2:#bec5d8;
    --text:#1a2035; --text2:#5a6380; --text3:#9aa0b5;
    --accent:#3a6bd4; --accent2:#2a56b8;
    --accent-glow:rgba(58,107,212,0.1); --scrollthumb:#bec5d8;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--mono);background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;line-height:1.5;overflow-x:hidden;transition:background 0.2s,color 0.2s;}
  ::-webkit-scrollbar{width:4px;height:4px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--scrollthumb);border-radius:2px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent);}

  /* ---- LAYOUT ---- */
  #app{display:flex;flex-direction:column;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:100;flex-shrink:0;}
  .logo{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
  .logo:hover{opacity:0.8;}
  .logo span{color:var(--text3);font-weight:300;}
  .header-right{display:flex;align-items:center;gap:10px;}
  nav{display:flex;gap:2px;background:var(--bg3);padding:3px;border-radius:var(--radius);border:1px solid var(--border);}
  .nav-btn{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:5px 14px;border:none;background:transparent;color:var(--text2);cursor:pointer;border-radius:2px;transition:all 0.15s;}
  .nav-btn:hover{color:var(--text);background:var(--bg2);}
  .nav-btn.active{background:var(--accent);color:#fff;}

  /* Auth bar */
  #auth-bar{display:flex;align-items:center;gap:8px;}
  #auth-status{font-size:11px;color:var(--text3);font-family:var(--display);letter-spacing:0.5px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background 0.3s;}
  .sync-dot.online{background:var(--green);}
  .sync-dot.syncing{background:var(--accent);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

  /* Subtle theme toggle */
  .theme-btn{background:transparent;border:1px solid var(--border);border-radius:999px;padding:4px 8px;cursor:pointer;font-size:14px;color:var(--text2);display:flex;align-items:center;gap:6px;opacity:0.7;transition:all 0.15s;}
  .theme-btn:hover{opacity:1;border-color:var(--accent);color:var(--accent);}
  .theme-btn .lbl{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;}

  /* Mobile hamburger menu */
  .hamburger{display:none;background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;cursor:pointer;color:var(--text2);font-size:18px;line-height:1;}
  .hamburger:hover{border-color:var(--accent);color:var(--accent);}
  
  .main-content{flex:1;padding:20px;max-width:1400px;width:100%;margin:0 auto;}

  /* ---- VIEWS ---- */
  .view{display:none;}
  .view.active{display:block;}

  /* ---- BUTTONS ---- */
  .btn{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:8px 16px;border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;background:var(--bg3);color:var(--text);transition:all 0.15s;white-space:nowrap;}
  .btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow);}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-primary:hover{background:var(--accent2);border-color:var(--accent2);color:#fff;}
  .btn-danger{border-color:var(--red);color:var(--red);background:transparent;}
  .btn-danger:hover{background:rgba(214,78,58,0.1);}
  .btn-sm{padding:5px 10px;font-size:11px;}
  .btn-icon{padding:6px 8px;}

  /* ---- INPUTS ---- */
  input,textarea,select{font-family:var(--mono);font-size:12px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 10px;width:100%;transition:border-color 0.15s;outline:none;}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}
  input::placeholder,textarea::placeholder{color:var(--text3);}
  textarea{resize:vertical;min-height:80px;}
  label{display:block;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);margin-bottom:4px;}
  .field{margin-bottom:14px;}

  /* ---- SECTION HEADERS ---- */
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .section-title{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--text);display:flex;align-items:center;gap:10px;}
  .section-title::before{content:'';display:block;width:4px;height:20px;background:var(--accent);}

  /* Schedule view toggle */
  .schedule-view-toggle{display:none;background:var(--bg3);padding:3px;border-radius:var(--radius);border:1px solid var(--border);}
  .schedule-view-toggle button{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:4px 12px;border:none;background:transparent;color:var(--text2);cursor:pointer;border-radius:2px;transition:all 0.15s;}
  .schedule-view-toggle button:hover{color:var(--text);background:var(--bg2);}
  .schedule-view-toggle button.active{background:var(--accent);color:#fff;}

  /* ---- SCHEDULE ---- */
  .schedule-scroll{overflow:auto;max-height:calc(100vh - 120px);}
  .week-grid{display:grid;grid-template-columns:56px repeat(7,1fr);grid-auto-rows:44px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;min-width:560px;}
  .day-grid{
    display:grid;
    grid-template-columns:56px 1fr;
    grid-auto-rows:44px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    grid-auto-rows: minmax(40px, auto);
  }
  .day-header{background:var(--bg2);padding:9px 6px;text-align:center;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  .day-header.today{color:var(--accent);}
  .day-header-time{background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:11;}
  .time-row-label{grid-column:1;background:var(--bg2);border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px 4px;text-align:right;font-size:9px;color:var(--text3);display:flex;align-items:flex-start;justify-content:flex-end;padding-top:8px;}
  .slot{background:var(--bg);border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px;min-height:44px;position:relative;cursor:pointer;transition:background 0.1s;touch-action:manipulation;}
  .slot:hover{background:var(--bg3);}
  .slot:hover .slot-add{opacity:1;}
  .slot-add{opacity:0;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text3);transition:opacity 0.1s;pointer-events:none;}
  .slot:has(.lesson-block) .slot-add{opacity:0!important;}
  
  .daily-nav {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    /* gap: 10px; */
    /* margin-bottom: 12px; */
  }

  /* Day title */
  .daily-nav .day-header {
    width: 100%;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.2;
  }

  /* Button row */
  .daily-nav-subnav {
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 10px;
    width: 100%;
    background: var(--bg2);
    padding: 4px;
    border-bottom: 1px solid var(--border);
  }

  /* Buttons */
  .day-nav-btn,
  .today-btn {
    flex-shrink: 0;
    height: 30px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
  }

  /* Arrow buttons */
  .day-nav-btn {
    width: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Today button */
  .today-btn {
    padding: 0 14px;
  }

  /* lesson block spans rows based on duration */
  .lesson-block{border-radius:2px;padding:4px 6px;font-size:11px;font-family:var(--display);font-weight:600;letter-spacing:0.3px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;z-index:2;margin:2px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  .lesson-block:hover{opacity:0.85;}
  .lesson-block .ss-name{font-size:12px;line-height:1.2;}
  .lesson-block .ss-dur{font-size:10px;opacity:0.7;margin-top:4px;}
  .lesson-block .ss-rm{opacity:0;font-size:10px;align-self:flex-end;line-height:1;cursor:pointer;}
  .lesson-block:hover .ss-rm{opacity:1;}

  /* Level colours */
  .level-beginner{background:rgba(58,173,122,0.18);color:var(--lv-beginner);border:1px solid rgba(58,173,122,0.3);}
  .level-intermediate{background:rgba(74,144,217,0.18);color:var(--lv-intermediate);border:1px solid rgba(74,144,217,0.3);}
  .level-advanced{background:rgba(155,125,202,0.18);color:var(--lv-advanced);border:1px solid rgba(155,125,202,0.3);}
  .level-pro{background:rgba(217,95,95,0.18);color:var(--lv-pro);border:1px solid rgba(217,95,95,0.3);}
  [data-theme="light"] .level-beginner{background:rgba(58,173,122,0.1);}
  [data-theme="light"] .level-intermediate{background:rgba(74,144,217,0.1);}
  [data-theme="light"] .level-advanced{background:rgba(155,125,202,0.1);}
  [data-theme="light"] .level-pro{background:rgba(217,95,95,0.1);}

  /* ---- STUDENTS ---- */
  .students-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .search-wrap{position:relative;flex:1;min-width:160px;}
  .search-wrap input{padding-left:30px;}
  .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none;}
  .students-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;}
  .student-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color 0.15s,transform 0.1s,box-shadow 0.15s;position:relative;overflow:hidden;}
  .student-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
  .student-card.level-beginner::before{background:var(--lv-beginner);}
  .student-card.level-intermediate::before{background:var(--lv-intermediate);}
  .student-card.level-advanced::before{background:var(--lv-advanced);}
  .student-card.level-pro::before{background:var(--lv-pro);}
  .student-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,0.12);}
  .student-card-name{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:0.5px;margin-bottom:4px;}
  .student-card-meta{font-size:11px;color:var(--text2);display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .level-tag{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:2px;}
  .tag{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;padding:2px 8px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:2px;}
  .tag-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .student-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .lesson-count{font-size:11px;color:var(--text3);}

  /* ---- MODAL ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;backdrop-filter:blur(3px);}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);width:100%;max-width:660px;margin:auto;animation:slideUp 0.18s ease;}
  @keyframes slideUp{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
  .modal-title{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:1px;text-transform:uppercase;}
  .modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;transition:color 0.1s;}
  .modal-close:hover{color:var(--text);}
  .modal-body{padding:20px;}
  .modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .dur-pills{display:flex;gap:6px;flex-wrap:wrap;}
  .dur-pill{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:5px 14px;border:1px solid var(--border2);border-radius:2px;background:var(--bg3);color:var(--text2);cursor:pointer;transition:all 0.1s;}
  .dur-pill.selected,.dur-pill:hover{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* ---- STUDENT PANEL ---- */
  .student-panel{display:none;position:fixed;inset:0;background:var(--bg);z-index:400;overflow-y:auto;animation:slideIn 0.2s ease;}
  @keyframes slideIn{from{transform:translateX(60px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .student-panel.open{display:block;}
  .panel-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 24px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:var(--bg2);
    z-index:10;
    flex-wrap:wrap;}
  .panel-name{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:1px;text-transform:uppercase;flex:1;}
  /* .panel-body{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 60px);} */
  .panel-body {
    display: grid;
    grid-template-columns: 290px 1fr;
    min-height: calc(100vh - 60px);
  }
  
  .panel-sidebar{border-right:1px solid var(--border);padding:20px;background:var(--bg2);}
  .panel-main{padding:20px;}
  .info-block{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border);}
  .info-block:last-child{border-bottom:none;}
  .info-label{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:5px;}
  .info-value{font-size:12px;color:var(--text);}

  @media (max-width: 768px) {
    .panel-body {
      display: flex;
      flex-direction: column;
    }

    .panel-sidebar {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }

    .panel-main {
      width: 100%;
    }
  }
  @media (max-width: 768px) {
    .panel-header {
      padding: 10px 12px;
      gap: 8px;
    }

    .panel-name {
      font-size: 18px;
      flex: 1 1 100%;
    }

    .panel-header button {
      flex: 1;
    }
  }
  @media (max-width: 768px) {
    .panel-sidebar,
    .panel-main {
      padding: 12px;
    }
  }
  /* ---- LESSON ENTRIES ---- */
  .lesson-entry{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;background:var(--bg2);overflow:hidden;}
  .lesson-entry-header{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;transition:background 0.1s;}
  .lesson-entry-header:hover{background:var(--bg3);}
  .lesson-date{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:0.5px;flex-shrink:0;}
  .lesson-preview{font-size:11px;color:var(--text3);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lesson-entry-body{display:none;padding:14px 16px;border-top:1px solid var(--border);}
  .lesson-entry-body.open{display:block;}
  .lesson-field{margin-bottom:10px;}
  .lesson-field-label{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:3px;}
  .lesson-field-value{font-size:12px;color:var(--text);white-space:pre-wrap;}
  
  /* Bullet point styling for lesson notes */
  .lesson-field-value ul{margin:0;padding-left:20px;}
  .lesson-field-value ul li{margin-bottom:4px;}
  .lesson-field-value ul ul{margin-top:4px;list-style-type:circle;}
  
  .bpm-track{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border2);padding:3px 10px;border-radius:2px;font-size:11px;margin:2px;}
  .bpm-track .arrow{color:var(--accent);}

  /* Enhanced notes editor */
  .notes-editor{font-family:var(--mono);font-size:12px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 10px;width:100%;min-height:120px;resize:vertical;outline:none;line-height:1.6;}
  .notes-editor:focus{border-color:var(--accent);}

  /* ---- STATS ---- */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:24px;}
  .stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .stat-value{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;color:var(--accent);letter-spacing:-1px;}
  .stat-label{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-top:4px;}

  /* ---- EMPTY STATE ---- */
  .empty-state{text-align:center;padding:50px 20px;color:var(--text3);}
  .empty-icon{font-size:44px;margin-bottom:14px;opacity:0.4;}
  .empty-title{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;color:var(--text2);}

  hr{border:none;border-top:1px solid var(--border);margin:14px 0;}

  @media(max-width:768px){
    .hamburger{display:block;}
    nav{position:fixed;top:52px;left:0;right:0;flex-direction:column;background:var(--bg2);border:1px solid var(--border);border-radius:0;border-left:none;border-right:none;padding:8px;gap:4px;display:none;z-index:99;}
    nav.open{display:flex;}
    .nav-btn{width:100%;text-align:left;padding:10px 14px;}
    .panel-body{grid-template-columns:1fr;}
    .panel-sidebar{border-right:none;border-bottom:1px solid var(--border);}
    .form-row,.form-row-3{grid-template-columns:1fr;}
    .main-content{padding:12px;}
    header{padding:0 12px;}
    .logo{font-size:18px;}
    /* .theme-btn .lbl{display:none;} */
    /* #auth-status{display:none;} */
    .section-header{gap:6px;}
    .section-title{font-size:16px;}
    .section-title::before{width:3px;height:16px;}
    
    /* Mobile schedule improvements */
    .schedule-view-toggle{display:flex;}
    .week-grid{min-width:unset;overflow-x:auto;}
    .students-grid{grid-template-columns:1fr;}
    
    /* Make lesson blocks more touch-friendly */
    .lesson-block{padding:8px;font-size:12px;}
    .lesson-block .ss-name{font-size:13px;}
    .slot{min-height:52px;}
    #auth-bar{
      display: flex;
      flex-direction: column;
      width: 100%;
      justify-content: center;
    }
  }
</style>
</head>
<body>

<!-- MODAL: ASSIGN SLOT -->

<script type="module">
/* =============================================
   FIREBASE SETUP
============================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, getDoc, setDoc, deleteDoc, query, where, orderBy }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB3Stg20LBO6gtyKJuQYnvH7vc_0f7IgYE",
  authDomain: "link-in-bio-ce121.firebaseapp.com",
  projectId: "link-in-bio-ce121",
  storageBucket: "link-in-bio-ce121.appspot.com",
  messagingSenderId: "190933485466",
  appId: "1:190933485466:web:56a34b5c7c833d30ccdc23",
  measurementId: "G-XRH6TH6W61"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

let currentUser = null;
window.currentStudentId = null;

/* =============================================
   IN-MEMORY CACHE
============================================= */
let _students = [];
let _schedule = [];
let _lessons  = {};
let scheduleView = 'daily'; // 'daily' or 'weekly'
let currentDayIndex = new Date().getDay();

/* =============================================
   FIRESTORE HELPERS
============================================= */
const col = (path) => collection(db, path);
const ref = (path) => doc(db, path);

function teacherCol(sub)      { return col(`users/${currentUser.uid}/${sub}`); }
function teacherDoc(sub, id)  { return ref(`users/${currentUser.uid}/${sub}/${id}`); }

async function loadAll() {
  setSyncing(true);
  try {
    const sSnap = await getDocs(teacherCol('students'));
    _students = sSnap.docs.map(d => ({id: d.id, ...d.data()}));

    const schSnap = await getDocs(teacherCol('schedule'));
    _schedule = schSnap.docs.map(d => ({id: d.id, ...d.data()}));

    const lSnap = await getDocs(teacherCol('lessons'));
    _lessons = {};
    lSnap.docs.forEach(d => {
      const l = {id: d.id, ...d.data()};
      if (!_lessons[l.studentId]) _lessons[l.studentId] = [];
      _lessons[l.studentId].push(l);
    });
  } catch(e) {
    console.error('Load error:', e);
    showToast('Failed to load data — check console', true);
  }
  setSyncing(false);
}

async function fsSetStudent(student) {
  await setDoc(teacherDoc('students', student.id), student);
  const i = _students.findIndex(s => s.id === student.id);
  if (i !== -1) _students[i] = student; else _students.push(student);
}

async function fsDeleteStudent(id) {
  await deleteDoc(teacherDoc('students', id));
  _students = _students.filter(s => s.id !== id);
}

async function fsSetScheduleEntry(entry) {
  const stableId = `${entry.studentId}_${entry.day}_${entry.startTime.replace(/[: ]/g,'_')}`;
  entry.id = stableId;
  await setDoc(teacherDoc('schedule', stableId), entry);
  const i = _schedule.findIndex(e => e.id === stableId);
  if (i !== -1) _schedule[i] = entry; else _schedule.push(entry);
}

async function fsDeleteScheduleEntry(studentId, day, startTime) {
  const stableId = `${studentId}_${day}_${startTime.replace(/[: ]/g,'_')}`;
  await deleteDoc(teacherDoc('schedule', stableId));
  _schedule = _schedule.filter(e => e.id !== stableId);
}

async function fsDeleteAllScheduleForStudent(studentId) {
  const entries = _schedule.filter(e => e.studentId === studentId);
  await Promise.all(entries.map(e => deleteDoc(teacherDoc('schedule', e.id))));
  _schedule = _schedule.filter(e => e.studentId !== studentId);
}

async function fsSetLesson(lesson) {
  await setDoc(teacherDoc('lessons', lesson.id), lesson);
  if (!_lessons[lesson.studentId]) _lessons[lesson.studentId] = [];
  const i = _lessons[lesson.studentId].findIndex(l => l.id === lesson.id);
  if (i !== -1) _lessons[lesson.studentId][i] = lesson;
  else _lessons[lesson.studentId].push(lesson);
}

async function fsDeleteLesson(studentId, lessonId) {
  await deleteDoc(teacherDoc('lessons', lessonId));
  if (_lessons[studentId]) _lessons[studentId] = _lessons[studentId].filter(l => l.id !== lessonId);
}

async function fsDeleteAllLessonsForStudent(studentId) {
  const lessons = _lessons[studentId] || [];
  await Promise.all(lessons.map(l => deleteDoc(teacherDoc('lessons', l.id))));
  delete _lessons[studentId];
}

/* =============================================
   AUTH
============================================= */
window.handleAuth = async function() {
  if (currentUser) {
    await signOut(auth);
  } else {
    try {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
    } catch(e) {
      showToast('Sign-in failed: ' + e.message, true);
    }
  }
};

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user) {
    document.getElementById('auth-status').textContent = user.displayName || user.email;
    document.getElementById('auth-btn').textContent = 'Sign Out';
    document.getElementById('sync-dot').className = 'sync-dot syncing';
    await loadAll();
    document.getElementById('sync-dot').className = 'sync-dot online';
    renderSchedule();
    renderStudentsList();
    if (document.getElementById('view-dashboard').classList.contains('active')) renderDashboard();
  } else {
    document.getElementById('auth-status').textContent = 'Not signed in';
    document.getElementById('auth-btn').textContent = 'Sign In';
    document.getElementById('sync-dot').className = 'sync-dot';
    _students = []; _schedule = []; _lessons = {};
    renderSchedule(); renderStudentsList();
  }
});

/* =============================================
   SYNC STATUS
============================================= */
function setSyncing(on) {
  document.getElementById('sync-dot').className = 'sync-dot ' + (on ? 'syncing' : 'online');
}

function showToast(msg, isError=false) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:4px;font-family:var(--display);font-size:13px;letter-spacing:1px;z-index:9999;transition:opacity 0.3s'; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.background = isError ? 'var(--red)' : 'var(--green)';
  t.style.color = '#fff';
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity='0'; }, 3000);
}

/* =============================================
   DATA ACCESSORS
============================================= */
function getStudent(id)    { return _students.find(s => s.id === id); }
function getLessonsFor(sid){ return (_lessons[sid]||[]).sort((a,b)=>new Date(b.date)-new Date(a.date)); }
function todayStr()        { return new Date().toISOString().split('T')[0]; }
function uid()             { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* =============================================
   THEME
============================================= */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('st_theme', t);
  document.getElementById('theme-icon').textContent = t==='dark'?'☀️':'🌙';
  document.getElementById('theme-lbl').textContent  = t==='dark'?'Light':'Dark';
}
window.toggleTheme = () => applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
applyTheme(localStorage.getItem('st_theme')||'dark');

/* =============================================
   MOBILE MENU
============================================= */
window.toggleMobileMenu = function() {
  document.getElementById('main-nav').classList.toggle('open');
};

/* =============================================
   NAV
============================================= */
window.switchView = function(name) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelector(`[data-view="${name}"]`).classList.add('active');
  document.getElementById('main-nav').classList.remove('open');
  if(name==='schedule')  renderSchedule();
  if(name==='students')  renderStudentsList();
  if(name==='dashboard') renderDashboard();
};

/* =============================================
   MODAL HELPERS
============================================= */
window.openModal  = (id) => document.getElementById(id).classList.add('open');
window.closeModal = (id) => document.getElementById(id).classList.remove('open');
document.querySelectorAll('.modal-overlay').forEach(m =>
  m.addEventListener('click', e => { if(e.target===m) closeModal(m.id); })
);

/* =============================================
   SCHEDULE CONSTANTS & VIEW TOGGLE
============================================= */
const DAYS  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TIMES = [
  '12:00 PM','12:30 PM','1:00 PM','1:30 PM','2:00 PM','2:30 PM',
  '3:00 PM','3:30 PM','4:00 PM','4:30 PM','5:00 PM','5:30 PM',
  '6:00 PM','6:30 PM','7:00 PM','7:30 PM','8:00 PM','8:30 PM'
];

// Detect if mobile
function isMobile() {
  return window.innerWidth <= 768;
}

// Set default schedule view based on device
if (isMobile()) {
  scheduleView = 'daily';
} else {
  scheduleView = 'weekly';
}

window.setScheduleView = function(view) {
  scheduleView = view;
  document.querySelectorAll('.schedule-view-toggle button').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.toLowerCase() === view);
  });
  renderSchedule();
};

// Populate start-time dropdown
function populateAssignTimes() {
  const sel = document.getElementById('s-assign-time');
  sel.innerHTML = TIMES.map(t=>`<option value="${t}">${t}</option>`).join('');
}
populateAssignTimes();

/* =============================================
   SCHEDULE RENDER WITH AUTO-START TIME
============================================= */
function getEarliestScheduledTime() {
  if (!_schedule.length) return 0;
  
  const timeIndexes = _schedule.map(e => TIMES.indexOf(e.startTime)).filter(i => i !== -1);
  return timeIndexes.length ? Math.min(...timeIndexes) : 0;
}



function renderSchedule() {
  const container = document.getElementById('schedule-container');
  // const today = new Date().getDay()
  const today = currentDayIndex;
  
  // Get earliest scheduled time to start rendering from
  const startTimeIndex = getEarliestScheduledTime();
  const relevantTimes = TIMES.slice(startTimeIndex);
  
  if (scheduleView === 'weekly') {
    renderWeeklySchedule(container, today, relevantTimes, startTimeIndex);
  } else {
    renderDailySchedule(container, today, relevantTimes, startTimeIndex);
  }
}

window.previousDay = function() {
  currentDayIndex--;

  if (currentDayIndex < 0) {
    currentDayIndex = 6;
  }

  renderSchedule();
};

window.nextDay = function() {
  currentDayIndex++;

  if (currentDayIndex > 6) {
    currentDayIndex = 0;
  }

  renderSchedule();
};

window.goToToday = function() {
  currentDayIndex = new Date().getDay();
  renderSchedule();
};

function renderWeeklySchedule(container, today, relevantTimes, startTimeIndex) {
  const grid = document.createElement('div');
  grid.className = 'week-grid';
  
  let html = '<div class="day-header day-header-time"></div>';
  DAYS.forEach((d, i) => {
    html += `<div class="day-header${i === today ? ' today' : ''}">${d}</div>`;
  });

  const occupied = {};

  relevantTimes.forEach((time, relIndex) => {
    const actualIndex = startTimeIndex + relIndex;
    html += `<div class="time-row-label">${time}</div>`;

    DAYS.forEach(day => {
      const cellKey = `${day}-${time}`;
      if (occupied[cellKey]) return;

      const entries = _schedule.filter(e => e.day === day && e.startTime === time);

      if (!entries.length) {
        html += `<div class="slot" onclick="openSlotModal('${day}','${time}')"><div class="slot-add">+</div></div>`;
        return;
      }

      const entry = entries[0];
      const s = getStudent(entry.studentId);
      const duration = entry.duration || 30;
      const span = Math.max(1, Math.round(duration / 30));

      for (let i = 1; i < span; i++) {
        if (relevantTimes[relIndex + i]) {
          occupied[`${day}-${relevantTimes[relIndex + i]}`] = true;
        }
      }

      if (!s) {
        html += `<div class="slot" style="grid-row:span ${span}" onclick="openSlotModal('${day}','${time}')"><div class="slot-add">+</div></div>`;
        return;
      }

      html += `
        <div class="lesson-block level-${s.level}" style="grid-row:span ${span}"
             onclick="openStudentPanel('${s.id}')">
          <div class="ss-name">${esc(s.name)}</div>
          <div class="ss-dur">${duration}m</div>
          <div class="ss-rm" onclick="event.stopPropagation();removeFromSlot('${s.id}','${day}','${time}')">✕</div>
        </div>`;
    });
  });

  grid.innerHTML = html;
  container.innerHTML = '';
  container.appendChild(grid);
}

function renderDailySchedule(container, today, relevantTimes, startTimeIndex) {
  const currentDay = DAYS[today];
  const grid = document.createElement('div');
  grid.className = 'day-grid';
  
  // let html = '<div class="day-header day-header-time"></div>';
  // html += `<div class="day-header today">${currentDay}</div>`;

  let html = `
    <div class="daily-nav">
            <div class="day-header today">
              ${currentDay}
            </div>
      <div class="daily-nav-subnav">
        
        <button class="day-nav-btn btn btn-primary" onclick="previousDay()">←</button>
        <button class="today-btn btn btn-primary" onclick="goToToday()">Today</button>
        <button class="day-nav-btn btn btn-primary" onclick="nextDay()">→</button>
        
      </div>
    </div>
  `;
  const occupied = {};

  relevantTimes.forEach((time, relIndex) => {
    const actualIndex = startTimeIndex + relIndex;
    html += `<div class="time-row-label">${time}</div>`;

    const cellKey = `${currentDay}-${time}`;
    if (occupied[cellKey]) {
      return;
    }

    const entries = _schedule.filter(e => e.day === currentDay && e.startTime === time);

    if (!entries.length) {
      html += `<div class="slot" onclick="openSlotModal('${currentDay}','${time}')"><div class="slot-add">+</div></div>`;
      return;
    }

    const entry = entries[0];
    const s = getStudent(entry.studentId);
    const duration = entry.duration || 30;
    const span = Math.max(1, Math.round(duration / 30));

    for (let i = 1; i < span; i++) {
      if (relevantTimes[relIndex + i]) {
        occupied[`${currentDay}-${relevantTimes[relIndex + i]}`] = true;
      }
    }

    if (!s) {
      html += `<div class="slot" style="grid-row:span ${span}" onclick="openSlotModal('${currentDay}','${time}')"><div class="slot-add">+</div></div>`;
      return;
    }

    html += `
      <div class="lesson-block level-${s.level}" style="grid-row:span ${span}"
           onclick="openStudentPanel('${s.id}')">
        <div class="ss-name">${esc(s.name)}</div>
        <div class="ss-dur">${duration}m</div>
        <div class="ss-rm" onclick="event.stopPropagation();removeFromSlot('${s.id}','${currentDay}','${time}')">✕</div>
      </div>`;
  });

  grid.innerHTML = html;
  container.innerHTML = '';
  container.appendChild(grid);
}

function convertToBullets(text) {
  if (!text) return '';
  
  const lines = text.split('\n');
  let html = '<ul>';
  let currentIndent = 0;
  
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    
    // Count leading tabs/spaces for indent level
    const indent = line.search(/\S/);
    const indentLevel = Math.floor(indent / 2); // 2 spaces = 1 indent level
    
    // Close nested lists if we're decreasing indent
    while (currentIndent > indentLevel) {
      html += '</ul>';
      currentIndent--;
    }
    
    // Open nested list if we're increasing indent
    while (currentIndent < indentLevel) {
      html += '<ul>';
      currentIndent++;
    }
    
    // Remove bullet characters if present
    const content = trimmed.replace(/^[•\-\*]\s*/, '');
    html += `<li>${esc(content)}</li>`;
  }
  
  // Close any remaining nested lists
  while (currentIndent > 0) {
    html += '</ul>';
    currentIndent--;
  }
  
  html += '</ul>';
  return html;
}

/* =============================================
   ENHANCED NOTES EDITOR
============================================= */
function setupNotesEditor() {
  const notesField = document.getElementById('l-notes');
  if (!notesField) return;
  
  notesField.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const start = this.selectionStart;
      const end = this.selectionEnd;
      const text = this.value;
      const lines = text.substring(0, start).split('\n');
      const currentLine = lines[lines.length - 1];
      
      // Check indent level
      const indent = currentLine.search(/\S/);
      const indentStr = currentLine.substring(0, indent);
      
      // Insert newline with same indent
      const newText = text.substring(0, start) + '\n' + indentStr + text.substring(end);
      this.value = newText;
      this.selectionStart = this.selectionEnd = start + 1 + indent;
    } else if (e.key === 'Tab') {
      e.preventDefault();
      const start = this.selectionStart;
      const end = this.selectionEnd;
      const text = this.value;
      
      // Insert two spaces
      const newText = text.substring(0, start) + '  ' + text.substring(end);
      this.value = newText;
      this.selectionStart = this.selectionEnd = start + 2;
    }
  });
}

  students.forEach(s=>{
    const ls=_lessons[s.id]||[]; total+=ls.length;
    ls.forEach(l=>recent.push({...l,studentName:s.name,studentId:s.id,level:s.level}));

  recent.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const lv={beginner:0,intermediate:0,advanced:0,pro:0};
  students.forEach(s=>lv[s.level]=(lv[s.level]||0)+1);

  document.getElementById('stats-grid').innerHTML=[
    {value:students.length,label:'Students'},
    {value:total,label:'Total Lessons'},
    {value:lv.beginner,label:'Beginners'},
    {value:lv.intermediate,label:'Intermediate'},
    {value:lv.advanced,label:'Advanced'},
    {value:lv.pro,label:'Pro Level'},
  ].map(s=>`<div class="stat-card"><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div>`).join('');

  document.getElementById('recent-lessons').innerHTML=`
    <div class="section-title" style="margin-bottom:12px">Recent Lessons</div>
    ${recent.slice(0,10).map(l=>`
      <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;background:var(--bg2);cursor:pointer"
           onclick="openStudentPanel('${l.studentId}')">
        <span class="level-tag level-${l.level}" style="font-size:10px;padding:2px 7px">${l.level}</span>
        <span style="font-family:var(--display);font-weight:700">${esc(l.studentName)}</span>
        <span style="color:var(--text3);font-size:11px">${formatDate(l.date)}</span>
        ${l.duration?`<span style="font-size:10px;color:var(--text3)">${l.duration}min</span>`:''}
        <span style="flex:1;font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.notes?esc(l.notes.slice(0,60)):''}</span>
      </div>`).join('')||'<div class="empty-state" style="padding:28px"><div class="empty-title">No lessons recorded yet</div></div>'}`;
}

/* =============================================
   UTILITIES
============================================= */
function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatDate(s){
  if(!s) return '';
  return new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    document.querySelectorAll('.modal-overlay.open').forEach(m=>m.classList.remove('open'));
    if(document.getElementById('student-panel').classList.contains('open')) closeStudentPanel();
  }
});

// Initial render
renderSchedule();
renderStudentsList();
</script>
</body>
</html>
